services:
  - type: web
    name: better-cover-api
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm run build -w @better-cover/api
    startCommand: npm run start -w @better-cover/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: ALLOWED_ORIGINS
        sync: false
